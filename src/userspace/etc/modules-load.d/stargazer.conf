# Stargazer NGFW - Module auto-load configuration
# Modules listed here are loaded at boot by /etc/init.d/stargazer
# One module name per line (without .ko extension).
#
# Only list modules built as LOADABLE (=m). Kernel BUILT-IN (=y) features are
# initialised during kernel boot, so listing them makes insmod print a spurious
# FAIL (a stale .ko can't load over an already built-in feature). In the current
# kernel these are built-in and intentionally NOT listed:
#   nfnetlink_queue, ip_set, ip_set_hash_ip
# Check with `lsmod`: if a name does NOT appear there but its feature works, it
# is built-in and must not be listed here.

af_packet
pkt_forward
xt_NFQUEUE
xt_connbytes
xt_set
